<div class="login-container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <i class="bi bi-link-45deg" style="font-size: 3rem; color: #0d6efd;"></i>
      <h3 class="mt-2">URL App Login</h3>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          class="form-control"
          placeholder="Enter your email"
          required
        />
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          class="form-control"
          placeholder="Enter your password"
          required
        />
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage" class="alert alert-danger p-2 text-center">
        {{ errorMessage }}
      </div>

      <!-- Submit button -->
      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary" [disabled]="!loginForm.valid">
          Login
        </button>
      </div>
    </form>

    <!-- Register link -->
    <div class="text-center">
      <p>
        Don't have an account? 
        <a routerLink="/register" class="text-decoration-none">Register here</a>
      </p>
    </div>
  </div>
</div>
